services:
  # ─── Database: MySQL 8.0 ─────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: commerza_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-commerza_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-commerza}
      MYSQL_USER: ${DB_USER:-commerza_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-commerza_secret_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-commerza_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - commerza_net

  # ─── Cache: Redis 7 ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commerza_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - commerza_net

  # ─── Backend: NestJS API Engine ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commerza_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-commerza_user}:${DB_PASSWORD:-commerza_secret_password}@mysql:3306/${DB_NAME:-commerza}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-commerza-super-secret-production-key-change-this}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-MOCK}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - commerza_net

  # ─── Frontend: Next.js Studio ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commerza_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - "3001:3001"
    networks:
      - commerza_net

  # ─── Reverse Proxy: Nginx ───────────────────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: commerza_proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - commerza_net

volumes:
  mysql_data:
    name: commerza_mysql_data
  redis_data:
    name: commerza_redis_data
  backend_uploads:
    name: commerza_backend_uploads

networks:
  commerza_net:
    name: commerza_network
    driver: bridge
